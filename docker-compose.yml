services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swarmiq-backend
    ports:
      - "8000:8000"
    environment:
      - DEMO_MODE=true
      - DATABASE_URL=sqlite+aiosqlite:///./swarmiq.db
      - GLOBAL_SEED=42
      - CORS_ORIGINS=["http://localhost:3000"]
    volumes:
      - ./backend/app:/app/app
      - ./data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: swarmiq-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
